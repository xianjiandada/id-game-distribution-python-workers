# 历史隔离环境示例：当前本地联调复用 Java 项目的测试 MySQL / Redis。
# 常规验收不运行此文件，不用下列端口和账号覆盖 Java 配置。
# 保留供明确需要独立沙箱时参考；不会自动迁移或清理已有数据卷。
# 当前流程见 docs/本地验收.md。
services:
  creative-mysql:
    image: mysql:8.0
    container_name: creative-worker-mysql
    environment:
      MYSQL_DATABASE: sdkgamedb0
      MYSQL_USER: gamedis
      MYSQL_PASSWORD: gamedis_local
      MYSQL_ROOT_PASSWORD: root_local
    ports:
      - "53307:3306"
    volumes:
      - creative_mysql_data:/var/lib/mysql

  creative-redis:
    image: redis:7-alpine
    container_name: creative-worker-redis
    command: redis-server --requirepass redis_local
    ports:
      - "63790:6379"
    volumes:
      - creative_redis_data:/data

volumes:
  creative_mysql_data:
  creative_redis_data:
